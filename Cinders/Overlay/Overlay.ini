[Rainmeter]
Update=33
AccurateText=1
@Include=#@#Config.inc
OnRefreshAction=[!KeepOnScreen 0][!Draggable 0][!SnapEdges 0][!ZPos -2][!ClickThrough 1][!Move "#SCREENAREAX@1#" "#SCREENAREAY@1#"]

[Metadata]
Name=Cinders
Author=Cinders
Information=Click-through cinders on the primary monitor, on the desktop under icons and windows.
Version=1.2.2

; Click-through cinders for one monitor. This file is monitor 1, the primary screen.
; The measures at the bottom load monitors 2 and 3. SyncMonitors.ps1 only rewrites those copies.
; The window is pinned to that monitor and ignores the mouse, so clicks reach the desktop.
; There is no right-click menu. Knobs are in @Resources\Config.inc. Refresh this skin from the Rainmeter tray icon.
; Each cinder is a white glow tinted by EmberTint, with a smaller hot core tinted by EmberCore.
; The core is a separate meter. A Container would hide the halo, because container meters are not drawn.
; EmberSway=0 rises straight. EmberSway=1 adds a slow left-right drift and keeps that drift on the monitor.
; EmberDensity 1, 2, and 3 show 16, 32, and 48 cinders.

[MeasureDrift]
Measure=Calc
Formula=(Counter * #EmberSpeed#)
DynamicVariables=1

[MeterBounds]
Meter=Image
SolidColor=0,0,0,1
X=0
Y=0
W=#SCREENAREAWIDTH@1#
H=#SCREENAREAHEIGHT@1#
UpdateDivider=-1

[MeasureLife1]
Measure=Calc
Formula=((([MeasureDrift] * 1.352 + 1279.011) % (#SCREENAREAHEIGHT@1# - Round(19 * #EmberScale#))))
DynamicVariables=1

[MeterEmber1]
Meter=Image
Group=Embers | EmberLow
ImageName=#@#Embers\glow1.png
DynamicVariables=1
X=((13.173 * (1 + #EmberSway# * 2)) + (#SCREENAREAWIDTH@1# - (2 * (13.173 * (1 + #EmberSway# * 2))) - Round(19 * #EmberScale#)) * 0.789 + #EmberSway# * (13.173 * (1 + #EmberSway# * 2)) * Sin([MeasureDrift] * 0.01 + 3.809))
Y=((#SCREENAREAHEIGHT@1# - Round(19 * #EmberScale#)) - [MeasureLife1])
W=(Round(19 * #EmberScale#))
H=(Round(19 * #EmberScale#))
PreserveAspectRatio=1
ImageAlpha=(Clamp(Round(#EmberPeak# * 1.05 * Sin([MeasureLife1] * 3.1416 / (#SCREENAREAHEIGHT@1# - Round(19 * #EmberScale#))) * (0.72 + 0.28 * Sin([MeasureDrift] * 0.049 + 6.176))), 0, 255))
ImageTint=#EmberTint#
Hidden=(#EmberOn# = 0)

[MeterEmber1Core]
Meter=Image
Group=Embers | EmberLow
ImageName=#@#Embers\glow1.png
DynamicVariables=1
X=(((13.173 * (1 + #EmberSway# * 2)) + (#SCREENAREAWIDTH@1# - (2 * (13.173 * (1 + #EmberSway# * 2))) - Round(19 * #EmberScale#)) * 0.789 + #EmberSway# * (13.173 * (1 + #EmberSway# * 2)) * Sin([MeasureDrift] * 0.01 + 3.809)) + (Round(19 * #EmberScale# * (1 - 0.32) / 2)))
Y=(((#SCREENAREAHEIGHT@1# - Round(19 * #EmberScale#)) - [MeasureLife1]) + (Round(19 * #EmberScale# * (1 - 0.32) / 2)))
W=(Round(19 * #EmberScale# * 0.32))
H=(Round(19 * #EmberScale# * 0.32))
PreserveAspectRatio=1
ImageAlpha=(Clamp(Round(#EmberPeak# * 1.2 * Sin([MeasureLife1] * 3.1416 / (#SCREENAREAHEIGHT@1# - Round(19 * #EmberScale#))) * (0.72 + 0.28 * Sin([MeasureDrift] * 0.049 + 6.176))), 0, 255))
ImageTint=#EmberCore#
Hidden=(#EmberOn# = 0)


; BEGIN MONITOR SWITCH
; This block stays only in Overlay.ini. SyncMonitors.ps1 removes it from the other displays.
; Those displays sit above the wallpaper. A short display, the ScreenPad, is raised over the dashboard.
; A knob that is already 0 is not a change, so IfFalseAction never runs. The off action has to be IfTrueAction,
; and IfConditionMode=1 makes that one refresh actually fire it. Monitor 1 is last so it can unload after the others.

[MeasureMonitor2]
Measure=Calc
Formula=#Monitor2#
IfCondition=(#Monitor2# = 0)
IfTrueAction=[!DeactivateConfig "Cinders\Monitor2"]
IfFalseAction=[!ActivateConfig "Cinders\Monitor2" "Monitor2.ini"]
IfConditionMode=1
UpdateDivider=-1
DynamicVariables=1

[MeasureMonitor3]
Measure=Calc
Formula=#Monitor3#
IfCondition=(#Monitor3# = 0)
IfTrueAction=[!DeactivateConfig "Cinders\Monitor3"]
IfFalseAction=[!ActivateConfig "Cinders\Monitor3" "Monitor3.ini"]
IfConditionMode=1
UpdateDivider=-1
DynamicVariables=1

[MeasureMonitor1]
Measure=Calc
Formula=#Monitor1#
IfCondition=(#Monitor1# = 0)
IfTrueAction=[!DeactivateConfig "Cinders\Overlay"]
IfConditionMode=1
UpdateDivider=-1
DynamicVariables=1
; END MONITOR SWITCH

